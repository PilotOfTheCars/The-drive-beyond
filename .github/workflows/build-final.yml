name: Build final open-source game

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'src/final-game.js'
      - 'scripts/build.mjs'
      - 'scripts/finish-build-v2.mjs'
      - 'scripts/render-compat.mjs'
      - '.github/workflows/build-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned open-source dependencies
        run: npm install --no-audit --no-fund

      - name: Vendor pinned CC0 Quaternius nature assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/open/nature
          base='https://raw.githubusercontent.com/agentkaerf/FreeModels/db3df04d1e4714298a09510b26fb6de6645138a2'

          curl -fL "$base/Ultimate%20Stylized%20Nature%20-%20May%202022/glTF/BirchTree_1.gltf" -o assets/open/nature/BirchTree_1.gltf
          curl -fL "$base/Ultimate%20Stylized%20Nature%20-%20May%202022/glTF/BirchTree_1.bin" -o assets/open/nature/BirchTree_1.bin
          curl -fL "$base/Ultimate%20Stylized%20Nature%20-%20May%202022/glTF/BirchTree_Bark_Normal.png" -o assets/open/nature/BirchTree_Bark_Normal.png
          curl -fL "$base/Ultimate%20Stylized%20Nature%20-%20May%202022/glTF/BirchTree_Bark.jpg" -o assets/open/nature/BirchTree_Bark.jpg
          curl -fL "$base/Ultimate%20Stylized%20Nature%20-%20May%202022/glTF/BirchTree_Leaves.png" -o assets/open/nature/BirchTree_Leaves.png

          curl -fL "$base/Stylized%20Nature%20MegaKit%5BStandard%5D/glTF/Rock_Medium_1.gltf" -o assets/open/nature/Rock_Medium_1.gltf
          curl -fL "$base/Stylized%20Nature%20MegaKit%5BStandard%5D/glTF/Rock_Medium_1.bin" -o assets/open/nature/Rock_Medium_1.bin
          curl -fL "$base/Stylized%20Nature%20MegaKit%5BStandard%5D/glTF/Rocks_Diffuse.png" -o assets/open/nature/Rocks_Diffuse.png

      - name: Fix FBX root URL routing for browser builds
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/final-game.js')
          s = p.read_text('utf-8')
          old = "    if (!base || /^(blob:|data:)/.test(base)) return url;"
          new = "    if (!base || /^(blob:|data:)/.test(base) || /\\.fbx$/i.test(base)) return url;"
          if old not in s:
              raise SystemExit('Expected texture URL modifier line not found')
          s = s.replace(old, new, 1)
          s = s.replace("ui.protocol.textContent=String(err?.stack||err?.message||err);", "ui.protocol.textContent=String(err?.message||err);", 1)
          p.write_text(s, encoding='utf-8')
          print('FBX files now bypass the texture-folder URL modifier.')
          PY

      - name: Validate source
        run: npm run check

      - name: Bundle all runtime dependencies locally
        run: npm run build

      - name: Validate production bundle
        run: node --check src/final.bundle.js

      - name: Assert production invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'HatchBackLowPoly.fbx' src/final.bundle.js
          grep -q 'fab.fbx' src/final.bundle.js
          grep -q 'WebGLRenderer' .build/final-game.js
          grep -q 'ColliderDesc.trimesh' .build/final-game.js
          grep -q 'let roadCollider = null' .build/final-game.js
          if grep -q 'ColliderDesc.heightfield' .build/final-game.js; then
            echo 'Legacy Rapier heightfield path survived the compatibility build.' >&2
            exit 1
          fi
          if grep -q 'Textures/HatchBackLowPoly.fbx' src/final.bundle.js; then
            echo 'Player FBX was incorrectly rewritten into the texture folder.' >&2
            exit 1
          fi
          if grep -q 'textures/fab.fbx' src/final.bundle.js; then
            echo 'Traffic FBX was incorrectly rewritten into the texture folder.' >&2
            exit 1
          fi

      - name: Best-effort browser boot smoke test
        shell: bash
        run: |
          set +e
          python3 -m http.server 8000 >/tmp/tdb-http.log 2>&1 &
          server=$!
          sleep 2
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$chrome" ]; then
            "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --virtual-time-budget=15000 --dump-dom http://127.0.0.1:8000/ > /tmp/tdb-dom.html 2>/tmp/tdb-browser.log
            echo '--- loading status ---'
            grep -o '<div id="loadText"[^>]*>[^<]*' /tmp/tdb-dom.html || true
            grep -o '<div id="protocolNote"[^>]*>[^<]*' /tmp/tdb-dom.html || true
            echo '--- browser stderr tail ---'
            tail -80 /tmp/tdb-browser.log || true
          else
            echo 'No Chrome/Chromium binary available on runner; skipping browser smoke test.'
          fi
          kill "$server" 2>/dev/null || true
          exit 0

      - name: Cache-bust deployed runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('index.html')
          s = p.read_text('utf-8')
          version = os.environ['GITHUB_SHA'][:12]
          s, n = re.subn(r'final\.bundle\.js\?v=[^"\']+', f'final.bundle.js?v={version}', s, count=1)
          if n != 1:
              raise SystemExit('Could not update production bundle cache key in index.html')
          p.write_text(s, encoding='utf-8')
          print('Bundle cache key:', version)
          PY

      - name: Commit reproducible browser build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json index.html src/final.bundle.js src/final.bundle.js.map assets/open/nature
          if [ -f src/final.bundle.js.LEGAL.txt ]; then git add src/final.bundle.js.LEGAL.txt; fi
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Build integrated open-source browser game'
            git push
          fi
