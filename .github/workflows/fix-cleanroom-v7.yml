name: Fix clean-room v7
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cleanroom-v7.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch syntax and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/game-v7.js')
          s = p.read_text()
          s = s.replace("(input.brake?.55:0)", "(input.brake?.55:0)") if False else s
          s = s.replace("(input.brake?.55:0)", "(input.brake ? .55 : 0)")
          p.write_text(s)
          PY
          node --check src/game-v7.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game-v7.js
          git diff --cached --quiet || git commit -m 'Fix clean-room v7 walking input syntax'
          git push
