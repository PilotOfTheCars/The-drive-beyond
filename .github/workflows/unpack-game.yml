name: Unpack browser game
on:
  push:
    branches: [main]
    paths:
      - 'src/game.js.gz'
      - '.github/workflows/unpack-game.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decompress game source
        run: |
          python3 - <<'PY'
          import gzip, pathlib
          src = pathlib.Path('src/game.js.gz')
          data = src.read_bytes()
          code = gzip.decompress(data) if data[:2] == b'\\x1f\\x8b' else data
          code.decode('utf-8')
          pathlib.Path('src/game.js').write_bytes(code)
          PY
      - name: Commit browser-safe source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js
          if ! git diff --cached --quiet; then
            git commit -m 'Publish uncompressed game JavaScript for browsers'
            git push
          fi
