<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#111614" />
  <title>The Drive Beyond</title>
  <link rel="stylesheet" href="./src/prod.css?v=ui-321b3536" />
</head>
<body>
  <div id="game"></div>

  <div id="loading">
    <div class="loadCard">
      <h1>THE DRIVE BEYOND</h1>
      <div class="tag">NO DESTINATION.</div>
      <div id="loadText">Preparing the road…</div>
      <div class="loadTrack"><div id="loadBar"></div></div>
      <button id="driveBtn" disabled>DRIVE</button>
      <div id="protocolNote"></div>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div class="hudTopLeft"><b id="region">COASTAL FOOTHILLS</b><span id="timeWeather">07:20 · CLEAR</span></div>
    <button id="pauseBtn" class="round menu">•••</button>
    <div class="bars"><label>FUEL <b id="fuel">100</b></label><i><u id="fuelBar"></u></i><label>TYRE <b id="tyre">100</b></label><i><u id="tyreBar"></u></i></div>
    <div class="speed"><b id="speed">0</b><span>KM/H</span></div>
    <div id="interaction" class="interaction hidden"></div>
    <div id="toast"></div>
  </div>

  <div id="touch" class="hidden">
    <button id="touchCamera" class="round small">CAM</button>
    <div class="steer"><button data-hold="left">‹</button><button data-hold="right">›</button></div>
    <div class="pedals"><button data-hold="brake">BRAKE</button><button data-hold="throttle" class="go">GO</button></div>
    <button id="touchInteract" class="round interact hidden">E</button>
  </div>

  <div id="pause" class="panel hidden">
    <div class="panelCard"><h2>PAUSED</h2><button id="resumeBtn">RESUME</button><button id="journalBtn">JOURNEY JOURNAL</button><button id="handlingBtn">ACCESSIBLE</button><button id="graphicsBtn">BALANCED</button><button id="recoverBtn">RECOVER VEHICLE</button></div>
  </div>

  <div id="journal" class="panel hidden">
    <div class="panelCard journal"><h2>JOURNEY JOURNAL</h2><p><b id="jDistance">0.0</b> km travelled · <b id="jPeople">0</b> travellers met · <b id="jIncidents">0</b> incidents seen</p><div id="journalEntries"></div><button id="closeJournal">BACK TO ROAD</button></div>
  </div>

  <script>
  // iPad/WebKit occasionally fails Three.js' normal fetch() path on larger FBX files.
  // Keep fetch semantics for everything else, but retrieve FBX bytes with XMLHttpRequest.
  (() => {
    const nativeFetch = window.fetch.bind(window);
    window.fetch = function(input, init) {
      const url = typeof input === 'string' ? input : (input && input.url) || '';
      if (!/\.fbx(?:$|[?#])/i.test(url)) return nativeFetch(input, init);

      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.responseType = 'arraybuffer';
        xhr.timeout = 45000;
        xhr.onload = () => {
          const ok = (xhr.status >= 200 && xhr.status < 300) || xhr.status === 0;
          if (!ok) {
            const detail = `FBX HTTP ${xhr.status}: ${url}`;
            const note = document.getElementById('protocolNote');
            if (note) { note.textContent = detail; note.style.color = '#ffb7a7'; note.style.overflowWrap = 'anywhere'; }
            console.error('[TDB asset diagnostics]', detail, 'response:', xhr.responseURL);
            reject(new Error(detail));
            return;
          }
          resolve(new Response(xhr.response, {
            status: xhr.status === 0 ? 200 : xhr.status,
            statusText: xhr.statusText || 'OK',
            headers: { 'Content-Type': 'application/octet-stream' }
          }));
        };
        xhr.onerror = () => {
          const detail = `FBX network failure: ${url}`;
          const note = document.getElementById('protocolNote');
          if (note) { note.textContent = detail; note.style.color = '#ffb7a7'; note.style.overflowWrap = 'anywhere'; }
          reject(new Error(detail));
        };
        xhr.ontimeout = () => {
          const detail = `FBX timed out: ${url}`;
          const note = document.getElementById('protocolNote');
          if (note) { note.textContent = detail; note.style.color = '#ffb7a7'; note.style.overflowWrap = 'anywhere'; }
          reject(new Error(detail));
        };
        xhr.send();
      });
    };
  })();
  </script>
  <script type="module" src="./src/final.bundle.js?v=b06c5294c274"></script>
</body>
</html>
